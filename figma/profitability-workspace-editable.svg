<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1680" viewBox="0 0 1440 1680" fill="none">
  <defs>
    <style type="text/css">
      .t-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 700; fill: #101828; }
      .t-sub { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #667085; }
      .t-kpi-label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #667085; }
      .t-kpi-val { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 700; fill: #101828; }
      .t-h { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #344054; letter-spacing: 0.02em; }
      .t-cell { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #101828; }
      .t-muted { fill: #667085; }
      .t-right { text-anchor: end; }
      .card-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #101828; }
      .axis { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: #98a2b3; }
    </style>
